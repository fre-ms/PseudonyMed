[project]
name = "pseudonymed"
version = "0.1.0"
description = "Local de-identification of patient documents (PDF, scans, photos) with stable pseudonyms and local re-identification."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "fre.ms", email = "fre.ms@fre.ms" }]
keywords = ["pseudonymisation", "de-identification", "pdf", "redaction", "medical", "pseudonym"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = [
  # <2: PyMuPDF 2.0 (MuPDF 1.28.5) shifts glyphs after a redaction, see docs/pymupdf-redaction-shift.md
  "pymupdf>=1.25,<2",
  # the document layer is docrepro's: typdoc binds photos into a PDF, optdoc prepares the
  # pages, ocrdoc recognises them (text layer, OCR, areas), and docrepro's chain joins the
  # steps and writes the chain document that makes the prepared document and its reading
  # again from the original.  The steps are named as well, since PseudonyMed uses them
  # directly: their projects, their page texts, their panels
  "docrepro>=0.11",
  "doccor>=0.4",
  "typdoc>=0.3",
  "optdoc[cleanup]>=0.12",  # OpenCV, NumPy, Pillow, pillow-heif
  "ocrdoc[ocr,barcodes]>=0.5",  # RapidOCR with its models, onnxruntime, zxing-cpp
  # packages of terms, their store and their matcher: the core that lexterm builds on
  "lexcor>=0.2.7",
  # the vocabulary that guesswork must leave alone lives in lexterm's store, with its matcher
  "lexterm>=0.2.9",
  # identifying information beyond the patient's own: lexident's store and its recogniser
  "lexident>=0.2.4",
  "platformdirs>=4",
  "typer>=0.12",
]

[project.optional-dependencies]
carddav = ["keyring>=25"]
# the window, and the panels of optdoc and ocrdoc that are its steps of preparation and
# recognition
gui = ["PySide6>=6.7", "doccor[gui]>=0.4", "optdoc[gui]>=0.12", "ocrdoc[gui]>=0.5"]
pgp = ["pysequoia>=0.1.30"]  # key capsules for recipients (OpenPGP)
ner = [
  "spacy>=3.8",
  "de-core-news-md @ https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl",
]

[project.scripts]
pseudonymed = "pseudonymed.cli:app"
pseudonymed-gui = "pseudonymed.gui.app:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "faker>=30",
  "ruff>=0.6",
]
build = [
  "pyinstaller>=6.11",
]
# What script/quality_metrics.py needs.  Pinned, not floored: a snapshot is only comparable
# with the next one if the measuring instrument did not move underneath it.
quality = [
  "radon==6.0.1",
  "complexipy==3.3.0",
  "interrogate==1.7.0",
  "vulture==2.14",
  "coverage==7.6.10",
  "mypy>=1.14",
  "pylint>=3.3",  # symilar, the duplication instrument
]

[tool.uv.sources]
# released tags, not the working trees next door: PseudonyMed moves to a new docrepro on purpose
# (one tag of docrepro's repository names one state of all its packages: every step comes
# from the same tag, else uv refuses the conflicting URLs)
docrepro = { git = "https://github.com/fre-ms/docrepro", tag = "v0.11.0" }
doccor = { git = "https://github.com/fre-ms/docrepro", tag = "v0.11.0", subdirectory = "packages/doccor" }
typdoc = { git = "https://github.com/fre-ms/docrepro", tag = "v0.11.0", subdirectory = "packages/typdoc" }
optdoc = { git = "https://github.com/fre-ms/docrepro", tag = "v0.11.0", subdirectory = "packages/optdoc" }
ocrdoc = { git = "https://github.com/fre-ms/docrepro", tag = "v0.11.0", subdirectory = "packages/ocrdoc" }
lexcor = { git = "https://github.com/fre-ms/lexcor", tag = "v0.2.7" }
lexterm = { git = "https://github.com/fre-ms/lexterm", tag = "v0.2.9" }
lexident = { git = "https://github.com/fre-ms/lexident", tag = "v0.2.4" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the spaCy model wheel of the "ner" extra comes from a URL

[tool.hatch.build.targets.wheel]
packages = ["pseudonymed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 900
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Own annotations only; the libraries below publish no stubs.  `mypy` is expected to be clean.
files = ["pseudonymed"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "rapidocr.*", "onnxruntime.*", "cv2.*", "numpy.*", "PIL.*",
          "pillow_heif.*", "zxingcpp.*", "spacy.*", "pysequoia.*", "keyring.*", "faker.*",
          "PySide6.*", "typer.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships annotations that are incomplete (constants, Document iteration): read as Any.
module = ["pymupdf"]
follow_imports = "skip"
