[project]
name = "pseudonymed"
version = "0.1.0"
description = "Local de-identification of patient documents (PDF, scans, photos) with stable pseudonyms and local re-identification."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "fre.ms", email = "fre.ms@fre.ms" }]
keywords = ["pseudonymisation", "de-identification", "pdf", "redaction", "medical", "pseudonym"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = [
  # <2: PyMuPDF 2.0 (MuPDF 1.28.5) shifts glyphs after a redaction, see docs/pymupdf-redaction-shift.md
  "pymupdf>=1.25,<2",
  "platformdirs>=4",
  "typer>=0.12",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3", "onnxruntime>=1.18", "pillow>=10", "pillow-heif>=0.18"]
codes = ["zxing-cpp>=2.2", "pillow>=10"]
carddav = ["keyring>=25"]
gui = ["PySide6>=6.7"]
pgp = ["pysequoia>=0.1.30"]  # key capsules for recipients (OpenPGP)
ner = [
  "spacy>=3.8",
  "de-core-news-md @ https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl",
]

[project.scripts]
pseudonymed = "pseudonymed.cli:app"
pseudonymed-gui = "pseudonymed.gui.app:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "faker>=30",
  "ruff>=0.6",
]
build = [
  "pyinstaller>=6.11",
]
# What script/quality_metrics.py needs.  Pinned, not floored: a snapshot is only comparable
# with the next one if the measuring instrument did not move underneath it.
quality = [
  "radon==6.0.1",
  "complexipy==3.3.0",
  "interrogate==1.7.0",
  "vulture==2.14",
  "coverage==7.6.10",
  "mypy>=1.14",
  "pylint>=3.3",  # symilar, the duplication instrument
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the spaCy model wheel of the "ner" extra comes from a URL

[tool.hatch.build.targets.wheel]
packages = ["pseudonymed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 900
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Own annotations only; the libraries below publish no stubs.  `mypy` is expected to be clean.
files = ["pseudonymed"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "rapidocr.*", "onnxruntime.*", "cv2.*", "numpy.*", "PIL.*",
          "pillow_heif.*", "zxingcpp.*", "spacy.*", "pysequoia.*", "keyring.*", "faker.*",
          "PySide6.*", "typer.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships annotations that are incomplete (constants, Document iteration): read as Any.
module = ["pymupdf"]
follow_imports = "skip"
